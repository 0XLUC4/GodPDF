[package]
name = "godpdf"
description = "GodPDF: pure-Rust PDF workbench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "godpdf"
path = "src/main.rs"

[dependencies]
godpdf-core.workspace = true
godpdf-render.workspace = true
# GPUI Kit = the gpui-pre snapshot of Zed gpui + platform + gpui-component + Lucide icons.
# Aliased as `gpui` so gpui macros (actions!, derives) resolve through it.
gpui = { package = "gpui-kit", version = "0.9.1" }
rfd = "0.17"
# Same version gpui uses, to build its page bitmaps (`image::Frame`) and decode pictures.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Updates: GitHub releases; settings as JSON.
ureq = "3"
serde_json = "1"
# Same version gpui uses: round caps and joins for its stroked paths (`LineCap`, `LineJoin`).
lyon = "1.0"
base64 = "0.22"
getrandom = "0.4"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["io-util", "macros", "rt", "sync", "time"] }

[build-dependencies]
winresource = "0.1"

# Text recognition: the recognizer of Windows there, a downloaded model elsewhere.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Ocr", "Security_Cryptography", "Storage_Streams", "Globalization", "Win32_UI_WindowsAndMessaging", "Win32_System_Registry", "Win32_UI_Shell"] }

[target.'cfg(not(windows))'.dependencies]
ocrs = "0.13"
rten = "0.26"
anyhow = "1"
