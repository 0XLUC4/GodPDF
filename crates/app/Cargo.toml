[package]
name = "godpdf"
description = "GodPDF: pure-Rust PDF workbench"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "godpdf"
path = "src/main.rs"

[dependencies]
godpdf-core.workspace = true
godpdf-render.workspace = true
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
egui-phosphor = "0.13"
# Read /Rotate + crop box origin for annotation coordinates (no core API for it yet).

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = "3"
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "BlobPropertyBag", "Document", "Element", "HtmlAnchorElement", "HtmlCanvasElement", "Url", "Window"] }

[build-dependencies]
winresource = "0.1"
