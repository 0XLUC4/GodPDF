[workspace]
resolver = "3"
members = ["crates/core", "crates/render", "crates/app"]

[workspace.package]
version = "1.8.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
godpdf-core = { path = "crates/core" }
godpdf-render = { path = "crates/render" }
lopdf = { version = "0.45", default-features = false }
hayro = "0.8"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Rendering is unusably slow unoptimized; optimize deps even in dev.
[profile.dev.package."*"]
opt-level = 2
