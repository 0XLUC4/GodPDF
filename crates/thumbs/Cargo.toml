[package]
name = "godpdf-thumbs"
description = "Windows Explorer thumbnails of PDF files (shell extension DLL)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
godpdf-render.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem"] }
windows-core = "0.62"

[dev-dependencies]
lopdf.workspace = true
